<!DOCTYPE html>
<html lang="en">

<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">

  <script>

    const handleResponse = async (response) => {

      const content = document.querySelector('#content');

      switch (response.status) {
        case 200:

          let obj = await response.json();

          let jsonString = JSON.stringify(obj);

          content.innerHTML = `<p>${jsonString}</p>`;

          break;
        case 201:
          content.innerHTML = `<b>Message: Created Successfully</b>`;
          break;
        case 204:
          content.innerHTML = `<b>Updated (No Content)</b>`;
          break;
        case 400:
          content.innerHTML = `<b>Bad Request</b>`;
          break;
        case 404:
          content.innerHTML = `<b>Not Found</b>`;
          break;
        default:
          content.innerHTML = `Error code not implemented by client.`;
          break;
      }
    };

    const requestUpdate = async (userForm) => {

      const url = userForm.querySelector('#urlField').value;
      const method = userForm.querySelector('#methodSelect').value;

      let response = await fetch(url, {
        method,
        headers: {
          'Accept': 'application/json'
        },
      });

      handleResponse(response);
    };

    const sendPost = async (nameForm) => {
      const url = nameForm.getAttribute('action');
      const method = nameForm.getAttribute('method');

      const name = nameForm.querySelector('#nameField').value;
      const age = nameForm.querySelector('#ageField').value;

      let body = JSON.stringify({ name, age });

      const response = await fetch(url, {
        method: method,
        headers: {
          'Content-Type': 'application/json',
          'Content-Length': body.length,
          'Accept': 'application/json',
        },
        body: body,
      });

      handleResponse(response);
    };

    const init = () => {
      const userForm = document.querySelector('#userForm');

      const getUsers = (e) => {
        e.preventDefault();

        requestUpdate(userForm);

        return false;
      }

      userForm.addEventListener('submit', getUsers);

      const nameForm = document.querySelector('#nameForm');

      const addUsers = (e) => {
        e.preventDefault();

        sendPost(nameForm);

        return false;
      }

      nameForm.addEventListener('submit', addUsers);
    };

    window.onload = init;

  </script>
</head>

<body>
  <section id="top">
    <h3>POST Status Code Tests</h3>
    <form id="nameForm" action="/addUser" method="post">
      <label for="name">Name: </label>
      <input id="nameField" type="text" name="name" />
      <label for="age">Age: </label>
      <input id="ageField" type="number" name="age" min="0" max="100" step="1" />
      <input type="submit" value="Add User" />
    </form>
    <form id="userForm" action="/getUsers" method="get">
      <select id='urlField'>
        <option value='/getUsers'>/getUsers</option>
        <option value='/notReal'>/notReal</option>
      </select>
      <select id="methodSelect">
        <option value="get">GET</option>
        <option value="head">HEAD</option>
      </select>
      <input type="submit" value="Get User" />
    </form>
  </section>
  <section id="content">
  </section>
</body>

</html>
